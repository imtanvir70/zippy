<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="ambientGlowBanner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileGradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="auroraRimBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="gridBanner" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" fill="url(#bgGradBanner)"/>
  <rect width="1200" height="500" fill="url(#gridBanner)"/>
  <circle cx="600" cy="250" r="300" fill="url(#ambientGlowBanner)"/>

  <rect x="545" y="160" width="110" height="110" rx="28" fill="url(#tileGradBanner)" stroke="url(#auroraRimBanner)" stroke-width="1.5"/>
  <text x="600" y="235" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">Z</text>
  <text x="600" y="320" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">ZIPPY BD</text>
  <text x="600" y="350" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">PREMIUM BANNER</text>
</svg>
